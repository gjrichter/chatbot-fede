<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot — Giorgio Fede Sindaco 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f4f8;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #c0392b;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    header .logo {
      background: white;
      color: #c0392b;
      font-weight: 900;
      font-size: 1.1rem;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      letter-spacing: -1px;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
    }

    header p {
      font-size: 0.78rem;
      opacity: 0.88;
      margin-top: 2px;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.93rem;
      line-height: 1.55;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .message.user {
      background: #c0392b;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.bot {
      background: white;
      color: #222;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .message.bot strong { color: #c0392b; }

    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 16px;
      background: white;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #c0392b;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-7px); }
    }

    #suggestions {
      padding: 0 20px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .suggestion {
      background: white;
      border: 1.5px solid #c0392b;
      color: #c0392b;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .suggestion:hover {
      background: #c0392b;
      color: white;
    }

    #input-area {
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      border: 1.5px solid #ddd;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 0.93rem;
      outline: none;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    #user-input:focus { border-color: #c0392b; }

    #send-btn {
      background: #c0392b;
      color: white;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    #send-btn:hover { background: #a93226; }
    #send-btn:disabled { background: #ccc; cursor: not-allowed; }

    #send-btn svg { width: 18px; height: 18px; }

    #reset-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }

    #reset-btn:hover { color: #c0392b; }

    .welcome-msg {
      text-align: center;
      color: #666;
      font-size: 0.88rem;
      padding: 20px;
    }

    .welcome-msg strong { color: #c0392b; font-size: 1rem; }

    /* Markdown rendering */
    .message.bot p { margin-bottom: 8px; }
    .message.bot p:last-child { margin-bottom: 0; }
    .message.bot ul, .message.bot ol { margin: 6px 0 8px 20px; }
    .message.bot li { margin-bottom: 4px; }
    .message.bot h1, .message.bot h2, .message.bot h3 { margin: 10px 0 4px; font-size: 1rem; color: #c0392b; }
    .message.bot code { background: #f0f0f0; border-radius: 3px; padding: 1px 5px; font-size: 0.87em; }
    .message.bot pre { background: #f0f0f0; border-radius: 6px; padding: 10px; overflow-x: auto; margin: 6px 0; }
    .message.bot pre code { background: none; padding: 0; }
    .message.bot blockquote { border-left: 3px solid #c0392b; margin: 6px 0; padding-left: 10px; color: #555; }

    /* Copy button */
    .message.bot { position: relative; }
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: none;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 3px 6px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
      font-size: 0.75rem;
      color: #888;
      line-height: 1;
    }
    .message.bot:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: #f0f0f0; color: #333; border-color: #bbb; }
    .copy-btn.copied { color: #27ae60; border-color: #27ae60; opacity: 1; }
  </style>
</head>
<body>

<header>
  <div class="logo">GF</div>
  <div>
    <h1>Chatbot — Programma Giorgio Fede Sindaco</h1>
    <p>Elezioni Comunali 2026 · San Benedetto del Tronto</p>
  </div>
</header>

<div id="chat-container">
  <div class="welcome-msg">
    <strong>Ciao! Sono il chatbot del programma di coalizione.</strong><br />
    Puoi chiedermi qualsiasi cosa sul programma "Progettiamo Insieme la San Benedetto del Futuro".
  </div>
</div>

<div id="suggestions">
  <button class="suggestion" onclick="sendSuggestion(this)">Cosa prevede il programma sull'ambiente?</button>
  <button class="suggestion" onclick="sendSuggestion(this)">Quali proposte ci sono per la mobilità?</button>
  <button class="suggestion" onclick="sendSuggestion(this)">Cosa si fa per i giovani?</button>
  <button class="suggestion" onclick="sendSuggestion(this)">Come viene gestito il porto?</button>
  <button class="suggestion" onclick="sendSuggestion(this)">Quali politiche per la casa?</button>
  <button class="suggestion" onclick="sendSuggestion(this)">Cosa prevede il piano sulla sicurezza?</button>
</div>

<div id="input-area">
  <button id="reset-btn" onclick="resetChat()" title="Nuova conversazione">↺ Ricomincia</button>
  <textarea id="user-input" placeholder="Scrivi la tua domanda sul programma…" rows="1"></textarea>
  <button id="send-btn" onclick="sendMessage()" title="Invia">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </button>
</div>

<script>
  let history = [];

  const chatContainer = document.getElementById('chat-container');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
  });

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = formatText(text);
    if (role === 'bot') {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.title = 'Copia risposta';
      btn.innerHTML = '⎘ Copia';
      btn.onclick = () => copyMessage(btn, div);
      div.appendChild(btn);
    }
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
    return div;
  }

  function copyMessage(btn, div) {
    const text = div.innerText.replace('⎘ Copia', '').trim();
    navigator.clipboard.writeText(text).then(() => {
      btn.innerHTML = '✓ Copiato';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerHTML = '⎘ Copia';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  function formatText(text) {
    return marked.parse(text);
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing-indicator';
    div.id = 'typing';
    div.innerHTML = '<span></span><span></span><span></span>';
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    history.push({ role: 'user', content: text });

    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();

    // Hide suggestions after first message
    document.getElementById('suggestions').style.display = 'none';

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history.slice(0, -1) })
      });

      hideTyping();
      const botDiv = addMessage('', 'bot');
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let accumulated = '';
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete last line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6).trim();
          if (payload === '[DONE]') break;
          try {
            const parsed = JSON.parse(payload);
            if (parsed.error) {
              botDiv.innerHTML = `⚠️ Errore: ${parsed.error}`;
              history.pop();
            } else if (parsed.token) {
              accumulated += parsed.token;
              botDiv.innerHTML = marked.parse(accumulated);
              chatContainer.scrollTop = chatContainer.scrollHeight;
            }
          } catch (e) {}
        }
      }

      if (accumulated) {
        botDiv.innerHTML = marked.parse(accumulated);
        history.push({ role: 'assistant', content: accumulated });
      }

    } catch (err) {
      hideTyping();
      addMessage(`⚠️ Errore: ${err.message}`, 'bot');
      history.pop();
    }

    sendBtn.disabled = false;
    userInput.focus();
  }

  function sendSuggestion(btn) {
    userInput.value = btn.textContent;
    sendMessage();
  }

  function resetChat() {
    history = [];
    chatContainer.innerHTML = `
      <div class="welcome-msg">
        <strong>Nuova conversazione avviata.</strong><br />
        Puoi chiedermi qualsiasi cosa sul programma di Giorgio Fede.
      </div>`;
    document.getElementById('suggestions').style.display = 'flex';
    fetch('/reset', { method: 'POST' });
  }
</script>
</body>
</html>
